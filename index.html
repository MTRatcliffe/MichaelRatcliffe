<style>
body{
    padding:15px;
    line-height:1.6;
    font-size:16px;
}

.page-wrap{
    max-width:900px;
    margin:0 auto;
}

.top-banner{
    text-align:center;
    margin:30px 0;
}

.top-banner img{
    max-width:100%;
    height:auto;
}

.contact-list li,
.files-list li,
.testimonials-list li{
    margin-bottom:10px;
    word-wrap:break-word;
}

    word-break:break-word;
}

@media (max-width:576px){
    body{
        padding:10px;
        font-size:16px;
    }

    .page-wrap{
        max-width:100%;
    }

    h2{
        font-size:1.4rem;
    }

<body>

<div class="container page-wrap">

    <div class="top-banner">
        <img src="img/banner.png" alt="Michael Ratcliffe banner">
    </div>

    <h2>Contact: <small>(Use Mobile Number From CV If Urgent)</small></h2>

    <ul class="contact-list">
        <li>
            <a href="https://www.linkedin.com/in/michael-ratcliffe/" target="_blank" rel="noopener">LinkedIn</a>
        </li>

        

        <li>
            Email: <span id="email-link"></span>
            <noscript>mike [at] michaelratcliffe [dot] com</noscript>
        </li>
    </ul>

    <h2>Files:</h2>

    <ul class="files-list">
        <li>
            <a href="https://www.michaelratcliffe.com/documents/Cv.pdf" target="_blank" rel="noopener">
                Curriculum Vitae
            </a>
        </li>

        <li>
            <a href="https://www.researchgate.net/publication/261505803_BLDC_motor_power_control_techniques_appraisal_Novel_current_control_technique" target="_blank" rel="noopener">
                Electronics Publication
            </a>
        </li>

        <li>
            <a href="https://www.nuffieldscholar.org/sites/default/files/reports/2017_UK_Michael-Ratcliffe_Technology-Adoption-By-Small-And-Medium-Sized-Agricultural-Businesses-In-The-Uk.pdf" target="_blank" rel="noopener">
                Nuffield Farming Report
            </a>
        </li>
    </ul>

    <h2>Testimonials</h2>

    <ul class="testimonials-list">
        <li>
            <a href="https://www.michaelratcliffe.com/Testimonials.html" target="_blank" rel="noopener">
                Click To View
            </a>
        </li>
    </ul>

    <footer class="text-muted text-center text-lg-start">
        <div class="container p-6"></div>
    </footer>

</div>

<script>
(function(){
    var user = "mike";
    var domain = "michaelratcliffe.com";
    var subject = "Website Enquiry";
    var body = "Hello Michael,\n\nI am contacting you regarding:\n\n\nRegards,\n";

    var link = document.createElement("a");
    link.href = "mailto:" + user + "@" + domain +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);
    link.textContent = user + "@" + domain;
    link.target = "_blank";
    link.rel = "noopener";

    document.getElementById("email-link").appendChild(link);
})();
</script>

</body>
